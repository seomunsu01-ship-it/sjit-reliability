name: Repair reliability dashboard
on:
  push:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for legacy repair workflows
        run: sleep 30
      - name: Patch index
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("document.getElementById('mResultBefore').value='';", "{const rb=document.getElementById('mResultBefore');if(rb)rb.value='';}")
          s=s.replace("document.getElementById('mResultBefore').value||old[\"Result before reliability test\"]||\"-\"", "document.getElementById('mResultBefore')?.value||old[\"Result before reliability test\"]||\"-\"")
          s=s.replace("document.getElementById('mResultBefore').value||old['Result before reliability test']||null", "document.getElementById('mResultBefore')?.value||old['Result before reliability test']||null")
          if 'cpk_review_result:document.getElementById(\'mCpkBefore\')?.value||null' not in s:
              s=s.replace("test_result:document.getElementById('mResult').value||null,\n    result_before:", "test_result:document.getElementById('mResult').value||null,\n    cpk_review_result:document.getElementById('mCpkBefore')?.value||null,\n    result_before:")
          old="const email=document.getElementById('loginEmail').value.trim(), password=document.getElementById('loginPassword').value;"
          new="const loginId=document.getElementById('loginEmail').value.trim(), password=document.getElementById('loginPassword').value;\n const email=loginId.includes('@')?loginId:loginId+'@naver.com';"
          s=s.replace(old,new).replace('if(!email||!password){err.textContent=', 'if(!loginId||!password){err.textContent=')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix reliability dashboard access and save error'
          git push
