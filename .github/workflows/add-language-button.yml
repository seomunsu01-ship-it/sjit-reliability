name: Add Language Button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Add visible Vietnamese language button') && !startsWith(github.event.head_commit.message, 'Add clickable defect detail card') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('daily-inspection/index.html')
          s=p.read_text(encoding='utf-8')
          if 'DEFECT-CARD-DETAIL' not in s:
              css='''<style id="defect-card-style">#kBad{cursor:pointer}#kBad:hover{text-decoration:underline}.defect-detail-overlay{position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}.defect-detail-box{width:min(1200px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 70px rgba(15,23,42,.28)}.defect-detail-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.defect-detail-head h2{margin:0;font-size:19px}.defect-detail-close{border:1px solid #d7dce5;background:#fff;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}.defect-detail-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.defect-detail-pill{background:#fff7f7;border:1px solid #fecaca;border-radius:9px;padding:9px 12px;font-size:12px}.defect-detail-table{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}.defect-detail-table th,.defect-detail-table td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}.defect-detail-table th{background:#f8fafc;color:#64748b}.defect-detail-empty{padding:30px;text-align:center;color:#64748b} </style>'''
              js='''<script id="DEFECT-CARD-DETAIL">(function(){function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function vi(){try{return window.parent!==window&&window.parent.location.pathname.indexOf('/vi.html')>=0}catch(e){return false}}function labels(){return vi()?{title:'Chi tiết lỗi',close:'Đóng',month:'Tháng',count:'Số lượng lỗi',date:'Ngày',maker:'Nhà cung cấp',part:'Mã Part',name:'Tên vật liệu',lot:'Số LOT',qty:'Số lượng lỗi',content:'Nội dung lỗi',result:'Kết quả',inspector:'Nhân viên kiểm tra',none:'Không có dữ liệu lỗi trong tháng đã chọn.'}:{title:'불량 상세 내용',close:'닫기',month:'조회 월',count:'불량 수량',date:'검사일자',maker:'공급업체(Maker)',part:'Part No.',name:'품명',lot:'LOT No.',qty:'불량 수량',content:'불량 내용',result:'판정',inspector:'검사원',none:'선택한 월에 불량 데이터가 없습니다.'}}function openDefect(){var S=window.supabaseClient||window.db;if(!S){alert('DB 연결 정보를 찾을 수 없습니다.');return}var l=labels(),monthEl=document.getElementById('dashboardMonth'),month=monthEl&&monthEl.value?monthEl.value:'';S.from('daily_inspections').select('inspection_date,customer,part_no,part_name,lot_no,bad_qty,result,defect_content,inspector').gt('bad_qty',0).order('inspection_date',{ascending:false}).then(function(r){if(r.error){alert(r.error.message);return}var rows=(r.data||[]).filter(function(x){return !month||String(x.inspection_date||'').indexOf(month)===0});var ov=document.createElement('div');ov.className='defect-detail-overlay';ov.innerHTML='<div class="defect-detail-box"><div class="defect-detail-head"><h2>🚨 '+l.title+'</h2><button class="defect-detail-close">'+l.close+'</button></div><div class="defect-detail-summary"><div class="defect-detail-pill">'+l.month+': <b>'+esc(month||'ALL')+'</b></div><div class="defect-detail-pill">'+l.count+': <b>'+rows.reduce(function(a,x){return a+Number(x.bad_qty||0)},0).toLocaleString()+' PCS</b></div><div class="defect-detail-pill">LOT: <b>'+rows.length+'</b></div></div><div class="table-wrap"><table class="defect-detail-table"><thead><tr><th>'+l.date+'</th><th>'+l.maker+'</th><th>'+l.part+'</th><th>'+l.name+'</th><th>'+l.lot+'</th><th>'+l.qty+'</th><th>'+l.content+'</th><th>'+l.result+'</th><th>'+l.inspector+'</th></tr></thead><tbody>'+ (rows.length?rows.map(function(x){return '<tr><td>'+esc(x.inspection_date)+'</td><td>'+esc(x.customer)+'</td><td>'+esc(x.part_no)+'</td><td>'+esc(x.part_name)+'</td><td>'+esc(x.lot_no)+'</td><td class="danger-text"><b>'+Number(x.bad_qty||0).toLocaleString()+'</b></td><td>'+esc(x.defect_content||'-')+'</td><td>'+esc(x.result||'FAIL')+'</td><td>'+esc(x.inspector||'-')+'</td></tr>'}).join(''):'<tr><td colspan="9" class="defect-detail-empty">'+l.none+'</td></tr>')+'</tbody></table></div></div>';document.body.appendChild(ov);ov.querySelector('.defect-detail-close').onclick=function(){ov.remove()};ov.onclick=function(e){if(e.target===ov)ov.remove()};document.addEventListener('keydown',function fn(e){if(e.key==='Escape'){ov.remove();document.removeEventListener('keydown',fn)}})})}function bind(){var n=document.getElementById('kBad');if(!n||n.dataset.defectBound)return false;n.dataset.defectBound='1';n.addEventListener('click',openDefect);return true}var t=setInterval(function(){if(bind())clearInterval(t)},500);setTimeout(function(){clearInterval(t);bind()},10000)})();</script>'''
              s=s.replace('</style></head><body>',css+'</style></head><body>',1) if '</style></head><body>' in s else s.replace('</head>',css+'</head>',1)
              s=s.replace('</body></html>',js+'</body></html>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily-inspection/index.html
          git diff --cached --quiet || git commit -m 'Add defect detail modal to dashboard'
          git push
