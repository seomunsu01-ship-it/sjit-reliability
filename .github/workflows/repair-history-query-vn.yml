# FINAL HISTORY REPAIR - latest main
name: Restore inspection history query
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable history controller
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('daily-inspection/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script>\s*/\*\s*SJIT_HISTORY_QUERY_FINAL_[^*]*\*/.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<script>\s*/\*\s*SJIT_HISTORY_PERIOD_FILTER_V1\s*\*/.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<script>\s*/\*\s*SJIT_HISTORY_PAGINATION_V2\s*\*/.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<script src="\./history-fix-v4\.js[^>]*></script>', '', s)
          s=re.sub(r'<script src="\./history-fix-v5\.js[^>]*></script>', '', s)
          old=re.search(r'function renderHistory\(\)\{.*?\}function renderStats', s, flags=re.S)
          if not old: raise SystemExit('renderHistory function not found')
          new=r'''function renderHistory(){
            const h=$('history'),table=h&&h.querySelector('table.table'),body=$('tbody');if(!h||!table||!body)return;
            if(!window._histUI){window._histUI={page:1,size:20};const box=document.createElement('div');box.id='histControls';box.style.cssText='display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 12px';box.innerHTML='<b>기간 조회</b><input id="histFrom2" type="date"><span>~</span><input id="histTo2" type="date"><button type="button" id="histToday2">오늘</button><button type="button" id="hist7_2">최근 7일</button><button type="button" id="histMonth2">이번 달</button><button type="button" id="histPrev2">지난 달</button><button type="button" id="histApply2" class="btn primary">조회</button><button type="button" id="histAll2" class="btn">전체</button>';table.parentElement.parentElement.insertBefore(box,table.parentElement);const sum=document.createElement('div');sum.id='histSummary2';sum.style.cssText='display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 12px';box.after(sum);const nav=document.createElement('div');nav.id='histPage2';nav.style.cssText='display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;padding:10px 0';table.parentElement.after(nav);h.querySelector('.month-bar')?.style.setProperty('display','none');h.querySelector('.month-summary')?.style.setProperty('display','none');const now=today(),ym=now.slice(0,7);$('histFrom2').value=ym+'-01';$('histTo2').value=now;const set=(f,t)=>{$('histFrom2').value=f;$('histTo2').value=t;window._histUI.page=1;renderHistory()};$('histToday2').onclick=()=>set(now,now);$('hist7_2').onclick=()=>{const d=new Date(now+'T00:00:00');d.setDate(d.getDate()-6);set(d.toISOString().slice(0,10),now)};$('histMonth2').onclick=()=>set(ym+'-01',now);$('histPrev2').onclick=()=>{const d=new Date(now+'T00:00:00'),a=new Date(d.getFullYear(),d.getMonth()-1,1),b=new Date(d.getFullYear(),d.getMonth(),0);set(a.toISOString().slice(0,10),b.toISOString().slice(0,10))};$('histApply2').onclick=()=>{window._histUI.page=1;renderHistory()};$('histAll2').onclick=()=>{$('histFrom2').value='';$('histTo2').value='';window._histUI.page=1;renderHistory()}}
            const ui=window._histUI,from=$('histFrom2').value,to=$('histTo2').value,term=($('search').value||'').trim().toLowerCase(),rf=$('filterResult').value;const d=rows.filter(x=>{const date=String(x.date||'').slice(0,10),text=[x.customer,x.part,x.name,x.lot].join(' ').toLowerCase();return(!from||date>=from)&&(!to||date<=to)&&(!term||text.includes(term))&&(!rf||x.result===rf)});const pages=Math.max(1,Math.ceil(d.length/ui.size));ui.page=Math.min(ui.page,pages);const a=(ui.page-1)*ui.size,e=Math.min(a+ui.size,d.length);body.innerHTML=d.slice(a,e).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.customer)+'</td><td>'+esc(x.part)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.lot)+'</td><td>'+x.inQty.toLocaleString()+'</td><td>'+x.testQty.toLocaleString()+'</td><td>'+x.badQty.toLocaleString()+'</td><td>'+((x.testQty?x.badQty/x.testQty*100:0).toFixed(2))+'%</td><td><span class="badge '+(x.result==='FAIL'?'fail':'pass')+'">'+x.result+'</span></td><td>'+esc(x.inspector||'-')+'</td></tr>').join('')||'<tr><td colspan="11" class="empty">조회된 검사 이력이 없습니다.</td></tr>';const test=d.reduce((s,x)=>s+x.testQty,0),bad=d.reduce((s,x)=>s+x.badQty,0),lots=new Set(d.map(x=>x.lot||x.part));$('histSummary2').innerHTML='<div class="card"><div class="label">기간</div><div class="num" style="font-size:16px">'+(from&&to?from+' ~ '+to:'전체 기간')+'</div></div><div class="card"><div class="label">검사 LOT 수</div><div class="num">'+lots.size+'</div></div><div class="card"><div class="label">검사 수량</div><div class="num">'+test.toLocaleString()+' pcs</div></div><div class="card"><div class="label">불량 수량</div><div class="num danger-text">'+bad.toLocaleString()+' pcs</div></div>';const nav=$('histPage2');nav.innerHTML='<span>'+ (d.length?(a+1):0)+'-'+e+' / '+d.length+'건</span><span id="histNums2"></span><span>페이지당</span><select id="histSize2"><option value="20">20건</option><option value="50">50건</option><option value="100">100건</option></select>';const nb=$('histNums2'),add=(txt,p,disabled,active)=>{const b=document.createElement('button');b.type='button';b.textContent=txt;b.disabled=disabled;b.className='btn'+(active?' primary':'');b.onclick=()=>{ui.page=p;renderHistory()};nb.appendChild(b)};add('‹',Math.max(1,ui.page-1),ui.page===1,false);for(let p=1;p<=pages;p++){if(p>7&&p<pages-1){if(p===8)nb.insertAdjacentHTML('beforeend',' <span>…</span> ');continue}add(String(p),p,false,p===ui.page)}add('›',Math.min(pages,ui.page+1),ui.page===pages,false);$('histSize2').value=String(ui.size);$('histSize2').onchange=()=>{ui.size=Number($('histSize2').value);ui.page=1;renderHistory()};
          }function renderStats'''
          s=s[:old.start()]+new+s[old.end()-len('function renderStats'):]
          s=s.replace('function renderStatsfunction renderStatsfunction renderStats(){','function renderStats(){').replace('function renderStatsfunction renderStats(){','function renderStats(){').replace('function renderStatsfunction renderStats','function renderStats')
          p.write_text(s,encoding='utf-8')
      - name: Commit and push safely
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff -- daily-inspection/index.html > /tmp/history.patch
          test -s /tmp/history.patch || exit 0
          git fetch origin main
          git reset --hard origin/main
          git apply /tmp/history.patch
          git add daily-inspection/index.html
          git commit -m 'Restore inspection history query controller' || true
          git push origin HEAD:main