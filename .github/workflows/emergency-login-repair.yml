name: Emergency login repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final verified root dashboard repair
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='FINAL_VERIFIED_AUTH_PATCH_V1'
          if marker in s:
              print('Final verified patch already present')
              raise SystemExit(0)
          s=s.replace("if(data.session) startAuthenticated(data.session);","if(data.session) setTimeout(()=>startAuthenticated(data.session),0);")
          s=s.replace("else if(session) startAuthenticated(session);","else if(session) setTimeout(()=>startAuthenticated(session),0);")
          s=re.sub(r'<script>\n\(function\(\)\{\n  const extra=\{ko:\{reliabilityStartDate:.*?</script>\n','',s,count=1,flags=re.S)
          s=s.replace('</body></html>','<!-- FINAL_VERIFIED_AUTH_PATCH_V1 --></body></html>')
          p.write_text(s,encoding='utf-8')
          assert 'MutationObserver' not in s
          print('Root dashboard patched:',len(s.encode('utf-8')),'bytes')
      - name: Verify root dashboard JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'FINAL_VERIFIED_AUTH_PATCH_V1' in s
          assert 'MutationObserver' not in s
          assert "else if(session) setTimeout(()=>startAuthenticated(session),0);" in s
          assert s.count("if(data.session) setTimeout(()=>startAuthenticated(data.session),0);") >= 2
          for i,b in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I),1):
              f=f'/tmp/check{i}.js'; Path(f).write_text(b,encoding='utf-8'); subprocess.run(['node','--check',f],check=True)
          print('ALL INLINE JS SYNTAX OK')
          PY
      - name: Commit final repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply final verified reliability dashboard fix'
          git push origin HEAD:main
