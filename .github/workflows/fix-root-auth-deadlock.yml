name: Fix root Supabase auth race
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix root getSession auth race'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch root getSession initialization
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(data.session) startAuthenticated(data.session);"
          new="if(data.session) setTimeout(()=>startAuthenticated(data.session),0);"
          if old not in s:
              raise SystemExit('Expected getSession line not found; no changes made.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git rm .github/workflows/fix-root-auth-deadlock.yml
          git commit -m 'Fix root getSession auth race'
          git push origin HEAD:main
