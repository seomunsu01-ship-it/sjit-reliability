name: Final history fix
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/final-history-fix.yml'
      - 'daily-inspection/history-fix-v5.js'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install final history controller
        run: |
          cat > daily-inspection/history-fix-v5.js <<'JS'
          (()=>{const $=id=>document.getElementById(id),state={rows:[],page:1,size:20};const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const iso=d=>{const x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)};function get(){const h=$('history');if(!h)return null;let d=[...h.querySelectorAll('input[type=date]')].filter(x=>x.offsetParent!==null);if(d.length<2){const x=document.createElement('div');x.className='history-period-tools';x.innerHTML='<b class="period-label">기간 조회</b><input id="histFrom" type="date"><span class="period-sep">~</span><input id="histTo" type="date"><button data-v5="today">오늘</button><button data-v5="7">최근 7일</button><button data-v5="month">이번 달</button><button data-v5="prev">지난 달</button><button id="histSearch" class="primary">조회</button><button id="histReset">전체</button>';(h.querySelector('.toolbar')||h.firstElementChild)?.insertAdjacentElement('afterend',x);d=[x.querySelector('#histFrom'),x.querySelector('#histTo')];const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1);d[0].value=iso(first);d[1].value=iso(now)}return{h,dates:d,text:h.querySelector('#search'),sel:h.querySelector('#filterResult'),table:h.querySelector('table.table')||h.querySelector('table')}}async function load(){const c=get(),S=window.sb||(typeof sb!=='undefined'?sb:null);if(!c||!S)return;let f=c.dates[0].value||'0000-01-01',t=c.dates[1].value||'9999-12-31';if(f>t){const z=f;f=t;t=z;c.dates[0].value=f;c.dates[1].value=t}const term=(c.text?.value||'').trim().toLowerCase(),rf=(c.sel?.value||'').trim().toUpperCase();const q=await S.from('daily_inspections').select('inspection_date,customer,part_no,part_name,lot_no,in_qty,test_qty,bad_qty,result,inspector').gte('inspection_date',f).lte('inspection_date',t).order('inspection_date',{ascending:false});if(q.error){console.error(q.error);return}state.rows=(q.data||[]).filter(r=>(!term||[r.customer,r.part_no,r.part_name,r.lot_no].join(' ').toLowerCase().includes(term))&&(!rf||rf==='ALL'||String(r.result||'').toUpperCase()===rf));state.page=1;render(c,f,t)}function render(c,f,t){const b=c.table?.tBodies[0];if(!b)return;const total=state.rows.length,pages=Math.max(1,Math.ceil(total/state.size));state.page=Math.min(state.page,pages);const a=(state.page-1)*state.size,e=Math.min(a+state.size,total);b.innerHTML=state.rows.slice(a,e).map(r=>`<tr><td>${esc(r.inspection_date)}</td><td>${esc(r.customer)}</td><td>${esc(r.part_no)}</td><td>${esc(r.part_name)}</td><td>${esc(r.lot_no)}</td><td>${Number(r.in_qty||0).toLocaleString()}</td><td>${Number(r.test_qty||0).toLocaleString()}</td><td>${Number(r.bad_qty||0).toLocaleString()}</td><td>${r.test_qty?((Number(r.bad_qty||0)/Number(r.test_qty||0))*100).toFixed(2):'0.00'}%</td><td><span class="badge ${String(r.result||'PASS').toUpperCase()==='FAIL'?'fail':'pass'}">${String(r.result||'PASS').toUpperCase()}</span></td><td>${esc(r.inspector||'-')}</td></tr>`).join('')||'<tr><td colspan="11" class="empty">검색된 검사 이력이 없습니다.</td></tr>';let n=c.h.querySelector('.history-final-pagination');if(!n){n=document.createElement('div');n.className='history-final-pagination';c.table.parentElement.appendChild(n)}n.innerHTML=`${total?a+1:0}-${e} / ${total}건　`;const box=document.createElement('span');n.appendChild(box);for(let p=1;p<=pages;p++){if(p>7&&p<pages-1){if(p===8)box.insertAdjacentHTML('beforeend',' … ');continue}const z=document.createElement('button');z.textContent=p;z.className=p===state.page?'active':'';z.onclick=()=>{state.page=p;render(c,f,t)};box.appendChild(z)}const s=document.createElement('select');[20,50,100].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v+'건';s.appendChild(o)});s.value=state.size;s.onchange=()=>{state.size=+s.value;state.page=1;render(c,f,t)};n.append('　페이지당 ',s);let sum=c.h.querySelector('.history-final-summary');if(!sum){sum=document.createElement('div');sum.className='history-final-summary';(c.h.querySelector('.month-summary')||c.table.parentElement).insertAdjacentElement('afterend',sum)}const test=state.rows.reduce((x,r)=>x+Number(r.test_qty||0),0),bad=state.rows.reduce((x,r)=>x+Number(r.bad_qty||0),0);sum.innerHTML=`<div>기간<br><b>${f} ~ ${t}</b></div><div>검사 LOT 수<br><b>${total} LOT</b></div><div>검사 수량<br><b>${test.toLocaleString()} pcs</b></div><div>불량 수량<br><b class="bad">${bad.toLocaleString()} pcs</b></div>`}function bind(){const c=get();if(!c||!c.h.classList.contains('active'))return;const b=c.h.querySelector('#histSearch');if(b&&!b.dataset.v5){b.dataset.v5='1';b.onclick=e=>{e.preventDefault();e.stopImmediatePropagation();load()}}const r=c.h.querySelector('#histReset');if(r&&!r.dataset.v5){r.dataset.v5='1';r.onclick=e=>{e.preventDefault();e.stopImmediatePropagation();c.text&&(c.text.value='');c.sel&&(c.sel.value='');load()}}c.h.querySelectorAll('[data-v5]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.onclick=e=>{e.preventDefault();e.stopImmediatePropagation();const d=new Date(),k=b.dataset.v5;if(k==='today')c.dates[0].value=c.dates[1].value=iso(d);else if(k==='7'){const x=new Date(d);x.setDate(d.getDate()-6);c.dates[0].value=iso(x);c.dates[1].value=iso(d)}else if(k==='month'){c.dates[0].value=iso(new Date(d.getFullYear(),d.getMonth(),1));c.dates[1].value=iso(d)}else{c.dates[0].value=iso(new Date(d.getFullYear(),d.getMonth()-1,1));c.dates[1].value=iso(new Date(d.getFullYear(),d.getMonth(),0))}load()}})}document.addEventListener('click',e=>{if(e.target.closest?.('[data-page="history"]'))setTimeout(bind,200)});setInterval(bind,700);setTimeout(bind,500)})();
          JS
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('daily-inspection/index.html');s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script[^>]+src=["\']\./history-fix-[^"\']+\.js[^>]*></script>','',s,flags=re.I)
          tag='<script src="./history-fix-v5.js?v=5"></script>'
          s=s.replace(tag,'')
          if '</body>' not in s: raise SystemExit('no body')
          s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add daily-inspection/index.html daily-inspection/history-fix-v5.js
          git commit -m 'Finalize inspection history logic [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
