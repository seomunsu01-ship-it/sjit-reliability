name: Final save null fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for other push workflows to settle
        run: sleep 45
      - name: Re-sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply reliability final patch
        run: python tools/reliability_final_fix.py
      - name: Normalize final guard markup
        run: python tools/fix_guard.py
      - name: Validate JavaScript-sensitive duplicates
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'delete button': s.count('id="deleteReportLink"'),
            'modal item id assignment': s.count("document.getElementById('reportModal').dataset.itemId=String(no);"),
            'delete button declaration': s.count("const deleteFileBtn=document.getElementById('deleteReportLink')"),
          }
          print(checks)
          assert checks['delete button']==1, checks
          assert checks['modal item id assignment']==1, checks
          assert checks['delete button declaration']==1, checks
          assert '?.value=' not in s, 'invalid optional chaining assignment found'
          assert 'reports/${targetNo}/' in s, 'per-row report path not found'
          assert 'reliability_start_date' in s and 'reliability_expected_end_date' in s, 'reliability date fields missing'
          guard=s[s.find('<script id="reliabilityFinalGuard">'):s.find('</script>',s.find('<script id="reliabilityFinalGuard">'))]
          assert '\\n' not in guard, 'literal backslash-n remains inside final guard'
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize reliability report isolation and date fixes'
          git pull --rebase origin main
          git push origin HEAD:main
