name: Final save null fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch active save and form reset
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          bad_reset = "document.getElementById('mResultBefore')?.value='';"
          good_reset = "const mrb=document.getElementById('mResultBefore'); if(mrb) mrb.value='';"
          if bad_reset in s:
              s = s.replace(bad_reset, good_reset, 1)
          old1 = "document.getElementById('mResultBefore').value='';"
          if old1 in s:
              s = s.replace(old1, good_reset, 1)
          old2 = "result_before:document.getElementById('mResultBefore').value||old['Result before reliability test']||null,"
          new2 = "result_before:document.getElementById('mResultBefore')?.value||old['Result before reliability test']||null,"
          if old2 in s:
              s = s.replace(old2, new2, 1)
          needle = "    test_status:document.getElementById('mStatus').value||null,"
          cpk = "    cpk_review_result:document.getElementById('mCpkBefore')?.value||null,"
          if needle in s and cpk not in s:
              s = s.replace(needle, needle+'\n'+cpk, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix invalid optional chaining assignment'
          git push origin HEAD:main
