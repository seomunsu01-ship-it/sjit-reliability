name: Final save null fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch active save, form reset, report isolation, and reliability dates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          s = s.replace("document.getElementById('mResultBefore')?.value='';", "const mrb=document.getElementById('mResultBefore'); if(mrb) mrb.value='';")
          s = s.replace("document.getElementById('mResultBefore').value='';", "const mrb=document.getElementById('mResultBefore'); if(mrb) mrb.value='';")
          s = s.replace("result_before:document.getElementById('mResultBefore').value||old['Result before reliability test']||null,", "result_before:document.getElementById('mResultBefore')?.value||old['Result before reliability test']||null,")

          marker = "async function saveManualV16(closeAfter){"
          if marker in s:
              a = s.index(marker)
              b = s.find("async function", a + len(marker))
              if b < 0: b = len(s)
              block = s[a:b]
              late = "  const statusValue=document.getElementById('mStatus').value||null;\n  let reliabilityStartDate=document.getElementById('mReliabilityStartDate').value||old['Reliability Test Start Date']||null;\n  let reliabilityExpectedEndDate=document.getElementById('mReliabilityExpectedEndDate').value||old['Reliability Test Expected End Date']||null;\n  const todayISO=new Date().toISOString().slice(0,10);\n  if(statusValue==='신뢰성 진행 중' && !reliabilityStartDate) reliabilityStartDate=todayISO;\n  if(statusValue==='Finished' && !reliabilityExpectedEndDate) reliabilityExpectedEndDate=todayISO;\n"
              block = block.replace(late, "", 1)
              payload_needle = "  const payload={\n"
              decl = "  const statusValue=document.getElementById('mStatus').value||null;\n  let reliabilityStartDate=document.getElementById('mReliabilityStartDate').value||old['Reliability Test Start Date']||null;\n  let reliabilityExpectedEndDate=document.getElementById('mReliabilityExpectedEndDate').value||old['Reliability Test Expected End Date']||null;\n  const todayISO=new Date().toISOString().slice(0,10);\n  if(statusValue==='신뢰성 진행 중' && !reliabilityStartDate) reliabilityStartDate=todayISO;\n  if(statusValue==='Finished' && !reliabilityExpectedEndDate) reliabilityExpectedEndDate=todayISO;\n"
              if payload_needle in block and decl not in block[:block.index(payload_needle)]:
                  block = block.replace(payload_needle, decl + payload_needle, 1)
              if "cpk_review_result:document.getElementById('mCpkBefore')?.value||old['CPK Review Result']||null," not in block:
                  block = block.replace("    result_after:document.getElementById('mResultAfter').value||old['Result after reliability test']||null,", "    result_after:document.getElementById('mResultAfter').value||old['Result after reliability test']||null,\n    cpk_review_result:document.getElementById('mCpkBefore')?.value||old['CPK Review Result']||null,", 1)
              s = s[:a] + block + s[b:]

          detail_old = "['Test Start Time','시험 시작',x['Test Start Time']],['Test End Time','시험 종료',x['Test End Time']],"
          detail_new = "['reliabilityStartDate','신뢰성 TEST 시작 일자',x['Reliability Test Start Date']],['reliabilityExpectedEndDate','신뢰성 TEST 종료 예상 일자',x['Reliability Test Expected End Date']],['Test Start Time','시험 시작',x['Test Start Time']],['Test End Time','시험 종료',x['Test End Time']],"
          if detail_old in s and "['reliabilityStartDate','신뢰성 TEST 시작 일자'" not in s: s = s.replace(detail_old, detail_new, 1)

          picker_old = "  document.getElementById('chosenFile').textContent='선택된 파일 없음';\n  document.getElementById('reportStoragePath').textContent='';"
          picker_new = "  document.getElementById('chosenFile').textContent='선택된 파일 없음';\n  const reportPicker=document.getElementById('reportFile'); if(reportPicker) reportPicker.value='';\n  document.getElementById('reportStoragePath').textContent='';"
          if picker_old in s and 'const reportPicker=document.getElementById' not in s: s = s.replace(picker_old, picker_new, 1)

          p.write_text(s, encoding='utf-8')
          print('changed:', s != original)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix active reliability save variables and date display'
          git pull --rebase origin main
          git push origin HEAD:main
