name: Final save null fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reliability final patch
        run: python tools/reliability_final_fix.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix per-row report deletion and reliability date automation'
          git pull --rebase origin main
          git push origin HEAD:main
