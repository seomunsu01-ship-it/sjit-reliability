name: Repair dashboard and language
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'Repair dashboard and language') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard and history
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('daily-inspection/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script id="DEFECT-CARD-DETAIL">.*?</script>','',s,flags=re.S)
          s=re.sub(r'<script id="DEFECT-CARD-DETAIL-V2">.*?</script>','',s,flags=re.S)
          s=re.sub(r'<script id="DEFECT-CARD-DETAIL-FIXED">.*?</script>','',s,flags=re.S)
          defect=r'''<script id="DEFECT-CARD-DETAIL-FIXED">(function(){
          function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}
          function openDetail(){
            var S=window.sb;if(!S)return;
            var m=document.getElementById('dashboardMonth'),month=m&&m.value?m.value:'';
            S.from('daily_inspections').select('inspection_date,customer,part_no,part_name,lot_no,bad_qty,result,defect_content,inspector').gt('bad_qty',0).order('inspection_date',{ascending:false}).then(function(q){
              if(q.error){console.error(q.error);return}var a=(q.data||[]).filter(function(x){return !month||String(x.inspection_date||'').indexOf(month)===0});
              var ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px';
              var box=document.createElement('div');box.style.cssText='width:min(1250px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 70px rgba(15,23,42,.28)';
              var total=a.reduce(function(n,x){return n+Number(x.bad_qty||0)},0);
              var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0;font-size:19px">🚨 불량 상세 내용</h2><button id="defectClose" style="border:1px solid #d7dce5;background:#fff;border-radius:8px;padding:7px 12px;font-weight:700">닫기</button></div><div style="margin-bottom:14px;font-size:12px">조회 월: <b>'+esc(month||'ALL')+'</b>　 불량 수량: <b>'+total.toLocaleString()+' PCS</b>　 LOT: <b>'+a.length+'</b></div>';
              h+='<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr>'+['검사일자','공급업체(Maker)','Part No.','품명','LOT No.','불량 수량','불량 내용','판정','검사원'].map(function(x){return '<th style="padding:9px;background:#f8fafc;text-align:left">'+x+'</th>'}).join('')+'</tr></thead><tbody>';
              h+=a.length?a.map(function(x){return '<tr>'+[x.inspection_date,x.customer,x.part_no,x.part_name,x.lot_no].map(function(v){return '<td style="padding:9px;border-bottom:1px solid #e2e8f0">'+esc(v)+'</td>'}).join('')+'<td style="padding:9px;border-bottom:1px solid #e2e8f0;color:#dc2626;font-weight:700">'+Number(x.bad_qty||0).toLocaleString()+'</td><td style="padding:9px;border-bottom:1px solid #e2e8f0">'+esc(x.defect_content||'-')+'</td><td style="padding:9px;border-bottom:1px solid #e2e8f0">'+esc(x.result||'FAIL')+'</td><td style="padding:9px;border-bottom:1px solid #e2e8f0">'+esc(x.inspector||'-')+'</td></tr>'}).join(''):'<tr><td colspan="9" style="padding:30px;text-align:center">선택한 월에 불량 데이터가 없습니다.</td></tr>';
              h+='</tbody></table>';box.innerHTML=h;ov.appendChild(box);document.body.appendChild(ov);box.querySelector('#defectClose').onclick=function(){ov.remove()};ov.onclick=function(e){if(e.target===ov)ov.remove()};
            });
          }
          function bind(){var n=document.getElementById('kBad');if(!n||n.dataset.defectBound)return false;n.dataset.defectBound='1';n.style.cursor='pointer';n.onclick=openDetail;return true}
          var i=setInterval(function(){if(bind())clearInterval(i)},300);setTimeout(function(){clearInterval(i);bind()},10000)
          })();</script>'''
          query=r'''<script>/* SJIT_HISTORY_QUERY_FIXED_V2 */(()=>{
            const state={rows:[],page:1,size:20},$=id=>document.getElementById(id);let busy=false;
            const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
            function active(){return $('history')?.classList.contains('active')}
            function controls(){const h=$('history');if(!h)return null;const d=[...h.querySelectorAll('input[type=date]')];const text=h.querySelector('input#search')||h.querySelector('input[type=text]');const rs=h.querySelector('select#filterResult')||[...h.querySelectorAll('select')].find(x=>[...x.options].some(o=>/PASS|FAIL|All Result/.test(o.textContent||'')));const t=h.querySelector('table.table')||h.querySelector('table');return{h,d,text,rs,t}}
            async function load(){const c=controls(),S=window.sb;if(!c||!S||busy)return;busy=true;try{let from=c.d[0]?.value||'0000-01-01',to=c.d[1]?.value||'9999-12-31';const q=await S.from('daily_inspections').select('inspection_date,customer,part_no,part_name,lot_no,in_qty,test_qty,bad_qty,result,inspector').gte('inspection_date',from).lte('inspection_date',to).order('inspection_date',{ascending:false});if(q.error)throw q.error;const term=(c.text?.value||'').trim().toLowerCase(),rf=c.rs?.value||'';state.rows=(q.data||[]).filter(x=>(!term||[x.customer,x.part_no,x.part_name,x.lot_no].join(' ').toLowerCase().includes(term))&&(!rf||String(x.result||'').toUpperCase()===String(rf).toUpperCase()));state.page=1;render()}catch(e){console.error('history query fixed',e)}finally{busy=false}}
            function render(){const c=controls();if(!c?.t)return;const b=c.t.tBodies[0];if(!b)return;const total=state.rows.length,pages=Math.max(1,Math.ceil(total/state.size));if(state.page>pages)state.page=pages;const start=(state.page-1)*state.size,end=Math.min(start+state.size,total);b.innerHTML=state.rows.slice(start,end).map(x=>`<tr><td>${esc(x.inspection_date)}</td><td>${esc(x.customer)}</td><td>${esc(x.part_no)}</td><td>${esc(x.part_name)}</td><td>${esc(x.lot_no)}</td><td>${Number(x.in_qty||0).toLocaleString()}</td><td>${Number(x.test_qty||0).toLocaleString()}</td><td>${Number(x.bad_qty||0).toLocaleString()}</td><td>${x.test_qty?((Number(x.bad_qty||0)/Number(x.test_qty||0))*100).toFixed(2):'0.00'}%</td><td><span class="badge ${String(x.result||'PASS').toUpperCase()==='FAIL'?'fail':'pass'}">${String(x.result||'PASS').toUpperCase()==='FAIL'?'FAIL':'PASS'}</span></td><td>${esc(x.inspector||'-')}</td></tr>`).join('')||'<tr><td colspan="11" class="empty">검색된 검사 이력이 없습니다.</td></tr>';let nav=c.t.parentElement.querySelector('.history-pagination');if(!nav){nav=document.createElement('div');nav.className='history-pagination';c.t.parentElement.appendChild(nav)}nav.innerHTML='';const info=document.createElement('div');info.className='history-pagination-info';info.textContent=`${total?start+1:0}-${end} / ${total}건`;const box=document.createElement('div');box.className='history-pagination-pages';const add=(txt,p,dis,act)=>{const z=document.createElement('button');z.type='button';z.textContent=txt;z.disabled=dis;if(act)z.className='active';z.onclick=()=>{state.page=p;render()};box.appendChild(z)};add('‹',Math.max(1,state.page-1),state.page===1,false);const list=pages<=7?Array.from({length:pages},(_,i)=>i+1):[1,...(state.page>4?['…']:[]),...Array.from({length:Math.max(0,Math.min(pages-1,state.page+1)-Math.max(2,state.page-1)+1)},(_,i)=>Math.max(2,state.page-1)+i),...(state.page<pages-3?['…']:[]),pages];list.forEach(x=>x==='…'?box.insertAdjacentHTML('beforeend','<span class="dots">…</span>'):add(String(x),x,false,x===state.page));add('›',Math.min(pages,state.page+1),state.page===pages,false);const sz=document.createElement('div');sz.className='history-pagination-size';sz.innerHTML='페이지당 <select><option>20</option><option>50</option><option>100</option></select>건';const sel=sz.querySelector('select');sel.value=String(state.size);sel.onchange=()=>{state.size=Number(sel.value)||20;state.page=1;render()};nav.append(info,box,sz)}
            function bind(){const c=controls();if(!c)return;const search=[...c.h.querySelectorAll('button')].find(b=>/조회|검색|Search|Tìm kiếm/.test((b.innerText||'').trim())&&!/Excel|CSV|초기화|Xóa/.test(b.innerText||''));if(search&&!search.dataset.queryFixed){search.dataset.queryFixed='1';search.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();load()},{capture:true})}c.d.forEach(x=>{if(!x.dataset.queryFixed){x.dataset.queryFixed='1';x.addEventListener('change',load)}});if(c.text&&!c.text.dataset.queryFixed){c.text.dataset.queryFixed='1';c.text.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();load()}})}}
            function tick(){if(active()){bind();load()}}document.addEventListener('click',e=>{if(e.target.closest?.('[data-page="history"]'))setTimeout(tick,250)});setInterval(()=>{if(active())bind()},1200);setTimeout(tick,900);
          })()</script>'''
          s=s.replace('</body></html>',query+defect+'</body></html>')
          p.write_text(s,encoding='utf-8')
          v=Path('daily-inspection/vi.html');x=v.read_text(encoding='utf-8')
          x=re.sub(r'<script id="SJIT_VI_EXTRA_V2">.*?</script>','',x,flags=re.S)
          extra=r'''<script id="SJIT_VI_EXTRA_V2">(()=>{const M={'Inspection History':'Lịch sử kiểm tra','검사 이력 조회 · Excel 일괄 업로드':'Tra cứu lịch sử kiểm tra · Tải Excel hàng loạt','Maker / Part / LOT':'Nhà cung cấp / Mã Part / Số LOT','All Result':'Tất cả kết quả','Excel 업로드':'Tải Excel','기간 조회':'Tra cứu theo thời gian','오늘':'Hôm nay','최근 7일':'7 ngày gần nhất','이번 달':'Tháng này','지난 달':'Tháng trước','조회':'Tra cứu','CSV':'CSV','페이지당':'Mục mỗi trang','건':'mục','검사 이력 조회':'Tra cứu lịch sử kiểm tra','검사 이력 · Excel 일괄 업로드':'Lịch sử kiểm tra · Tải Excel hàng loạt','Daily Inspection Dashboard':'Bảng điều khiển kiểm tra hàng ngày','Quality Management':'Quản lý chất lượng','월별 품질 현황':'Tình hình chất lượng theo tháng','전체':'Tất cả','PASS':'ĐẠT (PASS)','FAIL':'KHÔNG ĐẠT (FAIL)','검색된 검사 이력이 없습니다.':'Không tìm thấy lịch sử kiểm tra.','조회된 검사 이력이 없습니다.':'Không có lịch sử kiểm tra được tìm thấy.','초기화':'Đặt lại'};const f=document.getElementById('appFrame');function go(){const d=f.contentDocument;if(!d?.body)return;const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT),a=[];let n;while(n=w.nextNode()){const p=n.parentElement;if(!p||p.tagName==='SCRIPT'||p.tagName==='STYLE')continue;const raw=n.nodeValue.trim(),out=M[raw];if(out&&out!==raw)a.push([n,raw,out])}a.forEach(([n,r,o])=>n.nodeValue=n.nodeValue.replace(r,o));d.querySelectorAll('input,button,select').forEach(e=>['placeholder','title','aria-label'].forEach(k=>{const v=e.getAttribute(k);if(v&&M[v])e.setAttribute(k,M[v])}));d.documentElement.lang='vi';d.title='SJIT VINA · Quản lý chất lượng';const b=d.getElementById('langBtn');if(b){b.textContent='🇰🇷 한국어';b.onclick=()=>window.top.location.href='./index.html'}}f.addEventListener('load',()=>{go();setTimeout(go,300);setTimeout(go,900)});setInterval(go,1200)})();</script>'''
          x=x.replace('</body>\n</html>',extra+'</body>\n</html>')
          v.write_text(x,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add daily-inspection/index.html daily-inspection/vi.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair dashboard and language'
          git pull --rebase origin main
          git push
