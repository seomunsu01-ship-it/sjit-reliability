name: Repair dashboard and language
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'Repair dashboard and language') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('daily-inspection/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script id="DEFECT-CARD-DETAIL">.*?</script>','',s,flags=re.S)
          s=re.sub(r'<script id="DEFECT-CARD-DETAIL-V2">.*?</script>','',s,flags=re.S)
          patch=r'''<script id="DEFECT-CARD-DETAIL-FIXED">(function(){
          function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}
          function vi(){try{return location.pathname.indexOf('/vi.html')>=0}catch(e){return false}}
          function openDetail(){
            var S=window.sb;if(!S)return;
            var m=document.getElementById('dashboardMonth'),month=m&&m.value?m.value:'';
            var L=vi()?{t:'Chi tiết lỗi',c:'Đóng',month:'Tháng',qty:'Số lượng lỗi',date:'Ngày',maker:'Nhà cung cấp',part:'Mã Part',name:'Tên vật liệu',lot:'Số LOT',content:'Nội dung lỗi',result:'Kết quả',inspector:'Nhân viên kiểm tra',none:'Không có dữ liệu lỗi trong tháng đã chọn.'}:{t:'불량 상세 내용',c:'닫기',month:'조회 월',qty:'불량 수량',date:'검사일자',maker:'공급업체(Maker)',part:'Part No.',name:'품명',lot:'LOT No.',content:'불량 내용',result:'판정',inspector:'검사원',none:'선택한 월에 불량 데이터가 없습니다.'};
            S.from('daily_inspections').select('inspection_date,customer,part_no,part_name,lot_no,bad_qty,result,defect_content,inspector').gt('bad_qty',0).order('inspection_date',{ascending:false}).then(function(q){
              if(q.error){console.error(q.error);return}var a=(q.data||[]).filter(function(x){return !month||String(x.inspection_date||'').indexOf(month)===0});
              var ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
              var box=document.createElement('div');box.style.cssText='width:min(1200px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:22px';
              var total=a.reduce(function(n,x){return n+Number(x.bad_qty||0)},0),h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0">🚨 '+L.t+'</h2><button id="dc" style="padding:7px 12px">'+L.c+'</button></div>';
              h+='<div style="margin-bottom:14px;font-size:12px">'+L.month+': <b>'+esc(month||'ALL')+'</b>　 '+L.qty+': <b>'+total.toLocaleString()+' PCS</b>　 LOT: <b>'+a.length+'</b></div>';
              h+='<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr>'+[L.date,L.maker,L.part,L.name,L.lot,L.qty,L.content,L.result,L.inspector].map(function(x){return '<th style="padding:9px;background:#f8fafc;text-align:left">'+x+'</th>'}).join('')+'</tr></thead><tbody>';
              h+=a.length?a.map(function(x){return '<tr>'+[x.inspection_date,x.customer,x.part_no,x.part_name,x.lot_no].map(function(v){return '<td style="padding:9px;border-bottom:1px solid #e2e8f0">'+esc(v)+'</td>'}).join('')+'<td style="padding:9px;border-bottom:1px solid #e2e8f0;color:#dc2626;font-weight:700">'+Number(x.bad_qty||0).toLocaleString()+'</td><td style="padding:9px;border-bottom:1px solid #e2e8f0">'+esc(x.defect_content||'-')+'</td><td style="padding:9px;border-bottom:1px solid #e2e8f0">'+esc(x.result||'FAIL')+'</td><td style="padding:9px;border-bottom:1px solid #e2e8f0">'+esc(x.inspector||'-')+'</td></tr>'}).join(''):'<tr><td colspan="9" style="padding:30px;text-align:center">'+L.none+'</td></tr>';
              h+='</tbody></table>';box.innerHTML=h;ov.appendChild(box);document.body.appendChild(ov);box.querySelector('#dc').onclick=function(){ov.remove()};ov.onclick=function(e){if(e.target===ov)ov.remove()};
            }).catch(console.error)
          }
          function bind(){var n=document.getElementById('kBad');if(!n||n.dataset.fixed)return false;n.dataset.fixed='1';var t=n.closest('.card')||n;t.style.cursor='pointer';t.onclick=openDetail;return true}
          var i=setInterval(function(){if(bind())clearInterval(i)},300);setTimeout(function(){clearInterval(i);bind()},10000)
          })();</script>'''
          s=s.replace('</body></html>',patch+'</body></html>')
          p.write_text(s,encoding='utf-8')
          v=Path('daily-inspection/vi.html');x=v.read_text(encoding='utf-8').replace('v=vi3','v=vi4').replace('},3500)','},1200)');v.write_text(x,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add daily-inspection/index.html daily-inspection/vi.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair dashboard and language'
          git pull --rebase origin main
          git push