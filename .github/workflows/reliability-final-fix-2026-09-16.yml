name: Reliability final fix 2026-09-16
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final reliability fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          # 1. Real per-file delete button in the report modal.
          if 'id="deleteReportLink"' not in s:
              anchor='<button class="btn danger" id="deleteTestItemLink"'
              if anchor in s:
                  s=s.replace(anchor,'<button class="btn danger" id="deleteReportLink" type="button" style="display:none">첨부파일 삭제</button>\n'+anchor,1)

          # 2. Replace the report upload function with strict row-id isolation.
          a=s.find('async function uploadReportV16(rowId,file){')
          b=s.find('async function makeSignedReportUrlV16',a)
          if a>=0 and b>a:
              fn="""async function uploadReportV16(rowId,file){
  const targetNo=Number(rowId);
  if(!targetNo||!file)throw new Error('Report 파일과 시험 항목을 확인하세요.');
  const old=await getReportInfoV16(targetNo).catch(()=>null);
  const row=DATA.find(r=>Number(r.No)===targetNo);
  if(!row)throw new Error('선택한 시험 항목을 찾을 수 없습니다.');
  const ext=((file.name||'').match(/\\.([A-Za-z0-9]+)$/)||['','bin'])[1].toLowerCase();
  const token=(crypto.randomUUID?crypto.randomUUID().replace(/-/g,''):String(Date.now())+Math.random().toString(36).slice(2));
  const path=`reports/${targetNo}/${Date.now()}_${token}.${ext}`;
  const {error:upErr}=await supabaseClient.storage.from(REPORT_BUCKET_V16).upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});
  if(upErr)throw upErr;
  const todayISO=new Date().toISOString().slice(0,10);
  const status=row['Reliability Test Status']||'Not tested';
  let start=row['Reliability Test Start Date']||null;
  let end=row['Reliability Test Expected End Date']||null;
  if(status==='신뢰성 진행 중'&&!start)start=todayISO;
  if(status==='Finished'&&!start)start=todayISO;
  if(status==='Finished'&&!end)end=todayISO;
  const patch={report_path:path,report_filename:file.name,report_mime:file.type||null,reliability_start_date:start,reliability_expected_end_date:end,updated_at:new Date().toISOString()};
  const {data,error:dbErr}=await supabaseClient.from('reliability_tests').update(patch).eq('id',targetNo).select('*').single();
  if(dbErr){await supabaseClient.storage.from(REPORT_BUCKET_V16).remove([path]).catch(()=>{});throw dbErr;}
  if(old?.report_path&&old.report_path!==path)await supabaseClient.storage.from(REPORT_BUCKET_V16).remove([old.report_path]).catch(()=>{});
  return mapDbRow(data);
}
"""
              s=s[:a]+fn+s[b:]

          # 3. Make modal row id authoritative and reset file input per row.
          s=s.replace("currentReportNo=String(no);currentReportFile=null;","currentReportNo=String(no);currentReportFile=null;document.getElementById('reportModal').dataset.itemId=String(no);")

          # 4. Show delete button only for the current row's actual attachment.
          s=s.replace("const openBtn=document.getElementById('openReportFile');openBtn.style.display='none';","const openBtn=document.getElementById('openReportFile');openBtn.style.display='none';const deleteFileBtn=document.getElementById('deleteReportLink');if(deleteFileBtn)deleteFileBtn.style.display='none';",1)
          s=s.replace("if(info?.report_path){\n      const deleteFileBtn=document.getElementById('deleteReportLink'); if(deleteFileBtn) deleteFileBtn.style.display='inline-block';","if(info?.report_path){\n      const deleteFileBtn=document.getElementById('deleteReportLink'); if(deleteFileBtn) deleteFileBtn.style.display='inline-block';",1)

          # 5. Bind delete button to the existing delete function after it is defined.
          if "document.getElementById('deleteReportLink').onclick=()=>window.deleteReportNow();" not in s:
              marker='window.deleteReportNow = async function(){'
              if marker in s:s=s.replace(marker,"document.getElementById('deleteReportLink').onclick=()=>window.deleteReportNow();\n"+marker,1)

          # 6. Fix date automation on edit: only transition events set automatic dates.
          marker="  const statusValue=document.getElementById('mStatus').value||null;\n  let reliabilityStartDate=document.getElementById('mReliabilityStartDate').value||old['Reliability Test Start Date']||null;\n  let reliabilityExpectedEndDate=document.getElementById('mReliabilityExpectedEndDate').value||old['Reliability Test Expected End Date']||null;\n  const todayISO=new Date().toISOString().slice(0,10);\n  if(statusValue==='신뢰성 진행 중' && !reliabilityStartDate) reliabilityStartDate=todayISO;\n  if(statusValue==='Finished' && !reliabilityExpectedEndDate) reliabilityExpectedEndDate=todayISO;"
          repl="  const statusValue=document.getElementById('mStatus').value||null;\n  const oldStatus=old['Reliability Test Status']||'Not tested';\n  let reliabilityStartDate=document.getElementById('mReliabilityStartDate').value||old['Reliability Test Start Date']||null;\n  let reliabilityExpectedEndDate=document.getElementById('mReliabilityExpectedEndDate').value||old['Reliability Test Expected End Date']||null;\n  const todayISO=new Date().toISOString().slice(0,10);\n  if(statusValue==='신뢰성 진행 중' && oldStatus!=='신뢰성 진행 중' && !reliabilityStartDate) reliabilityStartDate=todayISO;\n  if(statusValue==='Finished' && oldStatus==='신뢰성 진행 중' && !reliabilityExpectedEndDate) reliabilityExpectedEndDate=todayISO;"
          if marker in s:s=s.replace(marker,repl,1)

          # 7. Add the two dates to the reliability status table.
          oldrow="return `<tr data-no=\"${x.No}\"><td>${i+1}</td><td>${escapeHtml(x['Requested Date by Planning team']||'-')}</td><td>${escapeHtml(x.Model||'-')}</td><td>${escapeHtml(cleanMaterial(x.Material))}</td><td>${escapeHtml(cleanCond(x['Test Condition']))}</td><td><span class=\"badge ${cls}\">${escapeHtml(res)}</span></td><td>${escapeHtml(st)}</td><td>${escapeHtml(x['Report No']||'-')}</td><td>${escapeHtml(x.PIC||'-')}</td></tr>`;"
          newrow="return `<tr data-no=\"${x.No}\"><td>${i+1}</td><td>${escapeHtml(x['Requested Date by Planning team']||'-')}</td><td>${escapeHtml(x.Model||'-')}</td><td>${escapeHtml(cleanMaterial(x.Material))}</td><td>${escapeHtml(cleanCond(x['Test Condition']))}</td><td><span class=\"badge ${cls}\">${escapeHtml(res)}</span></td><td>${escapeHtml(st)}</td><td>${escapeHtml(x['Reliability Test Start Date']||'-')}</td><td>${escapeHtml(x['Reliability Test Expected End Date']||'-')}</td><td>${escapeHtml(x['Report No']||'-')}</td><td>${escapeHtml(x.PIC||'-')}</td></tr>`;"
          if oldrow in s:s=s.replace(oldrow,newrow,1)
          oldhdr='<th data-k="requestDate">요청일</th><th data-k="model">Model</th><th data-k="material">자재</th><th data-k="condition">시험항목</th><th data-k="result">결과</th><th data-k="reliabilityTestStatus">상태</th><th data-k="reportNo">Report No.</th><th data-k="pic">PIC</th>'
          newhdr='<th data-k="requestDate">요청일</th><th data-k="model">Model</th><th data-k="material">자재</th><th data-k="condition">시험항목</th><th data-k="result">결과</th><th data-k="reliabilityTestStatus">상태</th><th data-k="reliabilityStartDate">TEST 시작일</th><th data-k="reliabilityExpectedEndDate">TEST 종료예정일</th><th data-k="reportNo">Report No.</th><th data-k="pic">PIC</th>'
          if oldhdr in s and 'TEST 시작일</th>' not in s:s=s.replace(oldhdr,newhdr,1)

          p.write_text(s,encoding='utf-8')
          print('changed:',s!=original)
          PY
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix report attachment isolation deletion and reliability dates'
          git pull --rebase origin main
          git push origin HEAD:main
