name: Fix defect card
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Add defect detail modal to dashboard') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add defect detail click handler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('daily-inspection/index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="DEFECT-CARD-DETAIL-V2"'
          if marker not in s:
              js=r'''<script id="DEFECT-CARD-DETAIL-V2">(function(){
          function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}
          function openDefectDetail(){
            var S=window.supabaseClient||window.db;
            if(!S){alert('DB 연결 정보를 찾을 수 없습니다.');return}
            var m=document.getElementById('dashboardMonth'), month=m&&m.value?m.value:'';
            var vi=false;try{vi=window.parent!==window&&window.parent.location.pathname.indexOf('/vi.html')>=0}catch(e){}
            var L=vi?{t:'Chi tiết lỗi',close:'Đóng',month:'Tháng',qty:'Số lượng lỗi',date:'Ngày kiểm tra',maker:'Nhà cung cấp',part:'Mã Part',name:'Tên vật liệu',lot:'Số LOT',content:'Nội dung lỗi',result:'Kết quả',inspector:'Nhân viên kiểm tra',none:'Không có dữ liệu lỗi trong tháng đã chọn.'}:{t:'불량 상세 내용',close:'닫기',month:'조회 월',qty:'불량 수량',date:'검사일자',maker:'공급업체(Maker)',part:'Part No.',name:'품명',lot:'LOT No.',content:'불량 내용',result:'판정',inspector:'검사원',none:'선택한 월에 불량 데이터가 없습니다.'};
            S.from('daily_inspections').select('inspection_date,customer,part_no,part_name,lot_no,bad_qty,result,defect_content,inspector').gt('bad_qty',0).order('inspection_date',{ascending:false}).then(function(r){
              if(r.error){alert(r.error.message);return}
              var rows=(r.data||[]).filter(function(x){return !month||String(x.inspection_date||'').indexOf(month)===0});
              var ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px';
              var box=document.createElement('div');box.style.cssText='width:min(1250px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 70px rgba(15,23,42,.28)';
              var total=rows.reduce(function(a,x){return a+Number(x.bad_qty||0)},0);
              var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0;font-size:19px">🚨 '+L.t+'</h2><button id="defectCloseV2" style="border:1px solid #d7dce5;background:#fff;border-radius:8px;padding:7px 12px;font-weight:700">'+L.close+'</button></div>';
              h+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><div style="background:#fff7f7;border:1px solid #fecaca;border-radius:9px;padding:9px 12px;font-size:12px">'+L.month+': <b>'+esc(month||'ALL')+'</b></div><div style="background:#fff7f7;border:1px solid #fecaca;border-radius:9px;padding:9px 12px;font-size:12px">'+L.qty+': <b>'+total.toLocaleString()+' PCS</b></div><div style="background:#fff7f7;border:1px solid #fecaca;border-radius:9px;padding:9px 12px;font-size:12px">LOT: <b>'+rows.length+'</b></div></div>';
              h+='<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px;min-width:950px"><thead><tr>'+[L.date,L.maker,L.part,L.name,L.lot,L.qty,L.content,L.result,L.inspector].map(function(x){return '<th style="padding:9px;border-bottom:1px solid #e2e8f0;background:#f8fafc;color:#64748b;text-align:left;white-space:nowrap">'+x+'</th>'}).join('')+'</tr></thead><tbody>';
              h+=rows.length?rows.map(function(x){return '<tr>'+[x.inspection_date,x.customer,x.part_no,x.part_name,x.lot_no].map(function(v){return '<td style="padding:9px;border-bottom:1px solid #e2e8f0;white-space:nowrap">'+esc(v)+'</td>'}).join('')+'<td style="padding:9px;border-bottom:1px solid #e2e8f0;color:#dc2626;font-weight:700">'+Number(x.bad_qty||0).toLocaleString()+'</td><td style="padding:9px;border-bottom:1px solid #e2e8f0">'+esc(x.defect_content||'-')+'</td><td style="padding:9px;border-bottom:1px solid #e2e8f0">'+esc(x.result||'FAIL')+'</td><td style="padding:9px;border-bottom:1px solid #e2e8f0">'+esc(x.inspector||'-')+'</td></tr>'}).join(''):'<tr><td colspan="9" style="padding:30px;text-align:center;color:#64748b">'+L.none+'</td></tr>';
              h+='</tbody></table></div>';box.innerHTML=h;ov.appendChild(box);document.body.appendChild(ov);box.querySelector('#defectCloseV2').onclick=function(){ov.remove()};ov.onclick=function(e){if(e.target===ov)ov.remove()};
            });
          }
          function bind(){var n=document.getElementById('kBad');if(!n||n.dataset.defectBoundV2)return false;n.dataset.defectBoundV2='1';n.style.cursor='pointer';n.title='Click to view defect details';n.addEventListener('click',openDefectDetail);return true}
          var t=setInterval(function(){if(bind())clearInterval(t)},500);setTimeout(function(){clearInterval(t);bind()},15000);
          })();</script>'''
              s=s.replace('</body></html>',js+'</body></html>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily-inspection/index.html
          git diff --cached --quiet || git commit -m 'Add defect detail modal to dashboard'
          git push
