[build]
  publish = "."
  command = "python scripts/fix_pagination_ui.py && python scripts/repair_history_ui.py"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/daily-inspection"
  to = "/"
  status = 301

[[redirects]]
  from = "/daily-inspection/"
  to = "/"
  status = 301

[[redirects]]
  from = "/daily-inspection/*"
  to = "/:splat"
  status = 301
