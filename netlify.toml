[build]
  publish = "."

# Clean static deploy: history query fix is embedded in the HTML.

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/daily-inspection"
  to = "/"
  status = 301

[[redirects]]
  from = "/daily-inspection/"
  to = "/"
  status = 301

[[redirects]]
  from = "/daily-inspection/*"
  to = "/:splat"
  status = 301
