hận đối sách cải tiến','파일 첨부':'Đính kèm tệp','파일 교체':'Thay tệp','글쓰기':'Viết bài','제목':'Tiêu đề','작성자':'Người đăng','내용을 입력하세요':'Nhập nội dung','취소':'Hủy','게시하기':'Đăng bài','게시 완료':'Đã đăng bài','게시글을 삭제할까요?':'Bạn có muốn xóa bài viết này không?','게시판을 불러오지 못했습니다.':'Không thể tải bảng thông báo.','삭제 실패':'Xóa thất bại','게시 실패':'Đăng bài thất bại','공지사항 · 품질 이슈 · 작업 공유':'Thông báo · Vấn đề chất lượng · Chia sẻ công việc','전체':'Tất cả','All Result':'Tất cả kết quả','PASS':'ĐẠT (PASS)','FAIL':'KHÔNG ĐẠT (FAIL)','Incoming LOT':'LOT nhập','Inspection LOT':'LOT kiểm tra','Incoming PCS':'PCS nhập','Inspection PCS':'PCS kiểm tra','Defect PCS':'PCS lỗi','Defect Rate':'Tỷ lệ lỗi','Date':'Ngày','Maker':'Nhà cung cấp (Maker)','Part No.':'Mã Part','Part Name':'Tên Part','In':'Nhập','Test':'Kiểm tra','Defect':'Lỗi','Rate':'Tỷ lệ','Result':'Kết quả','Inspector':'Nhân viên kiểm tra','Defect Content':'Nội dung lỗi','Comment':'Ghi chú','Quality performance summary':'Tổng hợp kết quả chất lượng','Nonconformance Management':'Quản lý sản phẩm không phù hợp','Notice Board':'Bảng thông báo','월별 품질 현황':'Tình hình chất lượng theo tháng','DB connected':'Đã kết nối DB','DB connecting':'Đang kết nối DB','DB error':'Lỗi kết nối DB','수량을 확인하세요.':'Vui lòng kiểm tra số lượng.','이메일과 비밀번호를 입력하세요.':'Vui lòng nhập email và mật khẩu.','로그인 중...':'Đang đăng nhập...','이메일과 6자 이상 비밀번호를 입력하세요.':'Vui lòng nhập email và mật khẩu có ít nhất 6 ký tự.','DB 저장 완료':'Đã lưu vào DB','DB 저장 실패':'Lưu DB thất bại','저장 실패':'Lưu thất bại','파일 저장 실패':'Lưu tệp thất bại','코멘트 저장 완료':'Đã lưu ghi chú','코멘트 저장 실패':'Lưu ghi chú thất bại','처리 상태를 해제했습니다.':'Đã hủy trạng thái xử lý','개선대책서 발행 처리 완료':'Đã hoàn tất phát hành đối sách cải tiến','개선대책서 접수 처리 완료':'Đã hoàn tất tiếp nhận đối sách cải tiến','파일을 저장하는 중...':'Đang lưu tệp...','파일은 3MB 이하만 첨부할 수 있습니다.':'Chỉ có thể đính kèm tệp tối đa 3MB.','파일 첨부 완료':'Đã đính kèm tệp','첨부파일 삭제 완료':'Đã xóa tệp đính kèm','코멘트 저장 완료':'Đã lưu ghi chú','게시글이 없습니다.':'Không có bài viết.','🇻🇳 Tiếng Việt':'🇰🇷 한국어'};
function tr(s){if(!s)return s;let out=MAP[s]||s;for(const [k,v] of Object.entries(MAP)){if(k!==s&&out.includes(k))out=out.split(k).join(v)}return out}
function translate(doc){const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(n=>{const p=n.parentElement;if(!p||['SCRIPT','STYLE'].includes(p.tagName))return;const raw=n.nodeValue;const t=tr(raw.trim());if(t!==raw.trim())n.nodeValue=raw.replace(raw.trim(),t)});doc.querySelectorAll('input,textarea,button,select').forEach(el=>{for(const a of ['placeholder','title','aria-label'])if(el.getAttribute(a)){const v=el.getAttribute(a),t=tr(v);if(t!==v)el.setAttribute(a,t)}});doc.title='SJIT VINA · Quản lý chất lượng'}
const frame=document.getElementById('appFrame');frame.addEventListener('load',()=>{try{const d=frame.contentDocument;translate(d);const obs=new MutationObserver(()=>translate(d));obs.observe(d.body,{subtree:true,childList:true,characterData:true});window._obs=obs}catch(e){console.error(e)}});
</script></body></html>
