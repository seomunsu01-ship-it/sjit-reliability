const frame=document.getElementById('appFrame');
let applying=false;
let timer=null;

function tr(s){return Object.prototype.hasOwnProperty.call(MAP,s)?MAP[s]:s}

function translate(doc){
 if(!doc||!doc.body||applying)return;
 applying=true;
 try{
  const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
  const nodes=[]; let n;
  while(n=walker.nextNode()){
   const p=n.parentElement;
   if(!p||p.tagName==='SCRIPT'||p.tagName==='STYLE')continue;
   const raw=n.nodeValue, text=raw.trim();
   if(!text)continue;
   const out=tr(text);
   if(out!==text)nodes.push([n,raw.replace(text,out)]);
  }
  nodes.forEach(([node,value])=>node.nodeValue=value);
  doc.querySelectorAll('input,textarea,button,select').forEach(el=>{
   ['placeholder','title','aria-label'].forEach(a=>{
    const v=el.getAttribute(a); if(!v)return;
    const out=tr(v); if(out!==v)el.setAttribute(a,out);
   });
  });
  doc.documentElement.lang='vi';
  doc.title='SJIT VINA · Quản lý chất lượng';
  const b=doc.getElementById('langBtn');
  if(b&&!b.dataset.viBound){
   b.dataset.viBound='1';
   b.onclick=()=>{window.top.location.href='./index.html'};
  }
 }catch(e){console.error('Vietnamese translation error',e)}
 applying=false;
}

function scheduleTranslate(){
 clearTimeout(timer);
 timer=setTimeout(()=>translate(frame.contentDocument),80);
}

frame.addEventListener('load',()=>{
 scheduleTranslate();
 setTimeout(scheduleTranslate,300);
 setTimeout(scheduleTranslate,1000);
});

frame.addEventListener('load',()=>{
 try{
  const doc=frame.contentDocument;
  if(!doc||!doc.body)return;
  const observer=new MutationObserver(scheduleTranslate);
  observer.observe(doc.body,{subtree:true,childList:true,characterData:true});
 }catch(e){console.error('Vietnamese observer error',e)}
});
</script>
<script>/* SJIT_VI_EXTRA_V2 */
    (()=>{
      const M={'Inspection History':'Lịch sử kiểm tra','검사 이력 조회 · Excel 일괄 업로드':'Tra cứu lịch sử kiểm tra · Tải Excel hàng loạt','Maker / Part / LOT':'Nhà cung cấp / Mã Part / Số LOT','All Result':'Tất cả kết quả','Excel 업로드':'Tải Excel','기간 조회':'Tra cứu theo thời gian','오늘':'Hôm nay','최근 7일':'7 ngày gần nhất','이번 달':'Tháng này','지난 달':'Tháng trước','조회':'Tra cứu','CSV':'CSV','페이지당':'Mục mỗi trang','건':'mục','검색된 검사 이력이 없습니다.':'Không tìm thấy lịch sử kiểm tra.','조회된 검사 이력이 없습니다.':'Không có lịch sử kiểm tra được tìm thấy.','조회 기간':'Khoảng thời gian','DB connected · 314 cases':'Đã kết nối DB · 314 trường hợp','DB connected':'Đã kết nối DB','Quality Management':'Quản lý chất lượng','Daily Inspection Dashboard':'Bảng điều khiển kiểm tra hàng ngày','월별 품질 현황':'Tình hình chất lượng theo tháng','검사 이력 조회':'Tra cứu lịch sử kiểm tra','검사 이력 · Excel 일괄 업로드':'Lịch sử kiểm tra · Tải Excel hàng loạt','초기화':'Đặt lại','전체':'Tất cả','PASS':'ĐẠT (PASS)','FAIL':'KHÔNG ĐẠT (FAIL)'};
      const f=document.getElementById('appFrame');let lock=false;
      function go(){if(lock)return;const d=f.contentDocument;if(!d?.body)return;lock=true;try{const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const a=[];let n;while(n=w.nextNode()){const p=n.parentElement;if(!p||p.tagName==='SCRIPT'||p.tagName==='STYLE')continue;const raw=n.nodeValue.trim();if(!raw)continue;let out=M[raw];if(out===undefined&&/^\d+-\d+ \/ \d+건$/.test(raw))out=raw.replace(/건$/,'mục');if(out&&out!==raw)a.push([n,raw,out])}a.forEach(([n,raw,out])=>n.nodeValue=n.nodeValue.replace(raw,out));d.querySelectorAll('input,button,select').forEach(e=>['placeholder','title','aria-label'].forEach(k=>{const v=e.getAttribute(k);if(v&&M[v])e.setAttribute(k,M[v])}));d.documentElement.lang='vi';const b=d.getElementById('langBtn');if(b)b.textContent='🇰🇷 한국어';if(b)b.onclick=()=>window.top.location.href='./index.html';}finally{lock=false}}
      f.addEventListener('load',()=>{go();setTimeout(go,300);setTimeout(go,1000)});setInterval(go,1500);
    })();</script></body>
