<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SJIT VINA · Inspection Analytics</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font:14px Arial;background:#f4f7fb;color:#172033}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.muted{color:#64748b;font-size:12px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e3e8ef;border-radius:12px;padding:16px;box-shadow:0 5px 20px #0f172a0b}.num{font-size:26px;font-weight:bold;margin-top:8px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:15px;margin-top:15px}.chart{height:300px}.bar{display:flex;align-items:center;gap:8px;margin:10px 0}.bar span:first-child{width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:14px;background:#e5e7eb;border-radius:8px;flex:1}.fill{height:100%;border-radius:8px;background:#2563eb}.fail{color:#dc2626}.pass{color:#059669}.status{padding:7px 10px;border-radius:99px;background:#ecfdf5;color:#047857;font-size:11px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}canvas{width:100%;height:100%}</style></head><body><div class="wrap"><div class="top"><div><h1>SJIT VINA Inspection Analytics</h1><div class="muted">Daily Incoming Inspection · Supabase DB 실시간 분석</div></div><div id="status" class="status">DB 연결 확인중</div></div><div class="cards"><div class="card"><div class="muted">전체 검사 건수</div><div id="cnt" class="num">0</div></div><div class="card"><div class="muted">전체 입고 수량</div><div id="inq" class="num">0</div></div><div class="card"><div class="muted">전체 검사 수량</div><div id="tq" class="num">0</div></div><div class="card"><div class="muted">전체 NG 수량</div><div id="nq" class="num">0</div></div><div class="card"><div class="muted">전체 불량률</div><div id="rate" class="num">0.00%</div></div></div><div class="grid"><div class="panel"><h3>최근 7일 검사 추이</h3><div class="chart"><canvas id="trend"></canvas></div></div><div class="panel"><h3>Maker별 검사 건수</h3><div id="makers"></div></div></div><div class="grid"><div class="panel"><h3>Maker별 불량률</h3><div id="makerRate"></div></div><div class="panel"><h3>FAIL 불량 Top 10</h3><div id="defects"></div></div></div></div><script>const db=window.supabase.createClient('https://heaouuczehysapjhoslv.supabase.co','sb_publishable_ijtjC3p8aHEhrczByMuODg_lPtVKxkk');const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]) )}function localDate(d){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh'}).format(d)}function draw(data){let c=$('trend'),ctx=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);w=c.clientWidth;h=c.clientHeight;let days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);days.push(localDate(d))}let vals=days.map(d=>data.filter(r=>r.inspection_date===d).reduce((s,r)=>s+(r.test_qty??r.inspection_qty??0),0));let max=Math.max(...vals,1);ctx.beginPath();ctx.lineWidth=3;vals.forEach((v,i)=>{let x=35+i*(w-55)/6,y=h-35-(v/max)*(h-70);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();vals.forEach((v,i)=>{let x=35+i*(w-55)/6,y=h-35-(v/max)*(h-70);ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.fillText(days[i].slice(5),x-15,h-12);ctx.fillText(v.toLocaleString(),x-15,y-10)});ctx.beginPath();ctx.moveTo(35,10);ctx.lineTo(35,h-35);ctx.lineTo(w-10,h-35);ctx.stroke()}async function load(){let {data,error}=await db.from('daily_inspections').select('*').order('inspection_date',{ascending:false});if(error){$('status').textContent='DB 오류';return}data=data||[];$('status').textContent='● DB 연결 · '+data.length+'건';let iq=data.reduce((s,r)=>s+(r.in_qty??r.incoming_qty??0),0),tq=data.reduce((s,r)=>s+(r.test_qty??r.inspection_qty??0),0),nq=data.reduce((s,r)=>s+(r.bad_qty??r.defect_qty??0),0);$('cnt').textContent=data.length.toLocaleString();$('inq').textContent=iq.toLocaleString();$('tq').textContent=tq.toLocaleString();$('nq').textContent=nq.toLocaleString();$('rate').textContent=(tq?nq/tq*100:0).toFixed(2)+'%';let m={};data.forEach(r=>{let k=r.customer||'Unknown';m[k]=(m[k]||0)+1});let mv=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,12),mx=Math.max(...mv.map(x=>x[1]),1);$('makers').innerHTML=mv.map(x=>'<div class="bar"><span>'+esc(x[0])+'</span><div class="track"><div class="fill" style="width:'+(x[1]/mx*100)+'%"></div></div><b>'+x[1]+'건</b></div>').join('');let mr={};data.forEach(r=>{let k=r.customer||'Unknown';mr[k]??={t:0,n:0};mr[k].t+=r.test_qty??r.inspection_qty??0;mr[k].n+=r.bad_qty??r.defect_qty??0});let rv=Object.entries(mr).map(([k,v])=>[k,v.t,v.t?v.n/v.t*100:0]).filter(x=>x[1]).sort((a,b)=>b[2]-a[2]).slice(0,12);$('makerRate').innerHTML=rv.map(x=>'<div class="bar"><span>'+esc(x[0])+'</span><div class="track"><div class="fill" style="width:'+Math.min(100,x[2]*5)+'%"></div></div><b class="'+(x[2]?'fail':'pass')+'">'+x[2].toFixed(2)+'%</b></div>').join('');let df={};data.filter(r=>r.result==='FAIL').forEach(r=>{let k=r.defect_content||'불량 내용 미입력';df[k]=(df[k]||0)+1});let dv=Object.entries(df).sort((a,b)=>b[1]-a[1]).slice(0,10);$('defects').innerHTML=dv.length?dv.map((x,i)=>'<div class="bar"><span>'+(i+1)+'. '+esc(x[0])+'</span><b class="fail">'+x[1]+'건</b></div>').join(''):'<div class="muted">FAIL 데이터 없음</div>';draw(data)}load();window.addEventListener('resize',()=>{db.from('daily_inspections').select('*').then(x=>draw(x.data||[]))})</script></body></html>
